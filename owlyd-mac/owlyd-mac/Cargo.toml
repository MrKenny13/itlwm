[package]
name = "owlyd-mac"
description = "The AWDL engine on macOS: owly-awdl's node on the itlawdl kext's cell, with the AirDrop receiver."
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[[bin]]
name = "owlyd-mac"
path = "src/main.rs"

[dependencies]
owly-awdl = { path = "../vendor/owly-awdl", features = ["driver"] }
owly-airdrop = { path = "../vendor/owly-airdrop", features = ["tokio", "mdns"] }
# Installs rustls's crypto provider for owly-airdrop's TLS (as owly-cli does).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
getrandom = "0.3"
libc = "0.2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "signal", "net", "io-util", "io-std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }

[lints]
workspace = true
